name: Build Clean Windows x64

on:
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: "Rebase onto latest pingdotgg/t3code main before building"
        required: false
        default: false
        type: boolean
      publish_release:
        description: "Also publish installer to this fork's GitHub Releases"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: build-clean-windows-x64
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64 (Telemetry-Free)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: clean
          fetch-depth: 50
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Sync with upstream pingdotgg/t3code
        if: inputs.sync_upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/pingdotgg/t3code.git 2>/dev/null || true
          git fetch --filter=blob:none --no-tags --depth=50 upstream main
          git rebase FETCH_HEAD
          git push --force-with-lease origin HEAD:clean

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata

      - id: release_meta
        name: Resolve build version
        shell: bash
        run: |
          set -euo pipefail
          nightly_date="$(date -u +%Y%m%d)"
          sha="$(git rev-parse HEAD)"
          node scripts/resolve-nightly-release.ts \
            --date "$nightly_date" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --sha "$sha" \
            --github-output

      - name: Resolve staged install cache
        id: stage_pnpm
        shell: bash
        run: |
          echo "dir=$RUNNER_TEMP/desktop-stage-pnpm" >> "$GITHUB_OUTPUT"
          echo "prefix=desktop-stage-pnpm-v2-win-x64-$(date -u +%G-%V)-" >> "$GITHUB_OUTPUT"

      - name: Restore staged install cache
        id: stage_pnpm_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.stage_pnpm.outputs.dir }}
          key: ${{ steps.stage_pnpm.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.stage_pnpm.outputs.prefix }}

      - name: Mark staged install cache
        shell: bash
        run: mkdir -p "${{ steps.stage_pnpm.outputs.dir }}" && touch "$RUNNER_TEMP/desktop-stage-pnpm.marker"

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/resource-monitor/target/x86_64-pc-windows-msvc/release/t3-resource-monitor.exe
          key: resource-monitor-x86_64-pc-windows-msvc-${{ hashFiles('.cargo/config.toml', 'native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-xwin@0.23.1

      - name: Build resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo xwin build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ steps.release_meta.outputs.version }}"

      - name: Build JS bundle (local-only, telemetry-free)
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          T3CODE_TELEMETRY_CHANNEL: "dev"
          T3CODE_TELEMETRY_ENABLED: "false"
        run: vp run build:desktop:bundle

      - name: Audit compiled bundles for telemetry endpoints
        shell: bash
        run: |
          set -euo pipefail
          if grep -rnE "ingest\.t3\.codes|phc_XOWci4oZP4VvLiEyrFqkFjP4CZn55mjYYBMREK5Wd6m|X-Axiom-Dataset" apps/server/dist apps/desktop/dist-electron; then
            echo "::error::Telemetry endpoint or key leaked into compiled bundle!"
            exit 1
          fi
          echo "Bundle audit passed: zero telemetry endpoints or keys present."

      - name: Package Windows x64 NSIS installer
        shell: bash
        env:
          pnpm_config_cache_dir: ${{ steps.stage_pnpm.outputs.dir }}/cache
          pnpm_config_store_dir: ${{ steps.stage_pnpm.outputs.dir }}/store
          pnpm_config_prefer_offline: "true"
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
          GITHUB_REPOSITORY: ""
        run: |
          vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version "${{ steps.release_meta.outputs.version }}" \
            --skip-build \
            --keep-stage \
            --verbose

      - name: Save staged install cache
        if: always()
        shell: bash
        run: |
          dir="${{ steps.stage_pnpm.outputs.dir }}"
          new=$(find "$dir/cache/v12" "$dir/store/v11/files" -type f -newer "$RUNNER_TEMP/desktop-stage-pnpm.marker" 2>/dev/null | wc -l | tr -d ' ')
          echo "Staged installs added $new cached files."
          echo "changed=$([[ "$new" -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        id: stage_pnpm_changed

      - name: Persist staged install cache
        if: steps.stage_pnpm_changed.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.stage_pnpm.outputs.dir }}
          key: ${{ steps.stage_pnpm_cache.outputs.cache-primary-key }}

      - name: Stage verification inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verify
          unpacked=$(ls -d "${TMPDIR:-/tmp}"/t3code-desktop-win-stage-*/app/dist/win-unpacked)
          tar -C "$(dirname "$unpacked")" -cf verify/unpacked.tar "$(basename "$unpacked")"
          esbuild=scripts/node_modules/.bin/esbuild
          banner="import{createRequire as __cr}from'node:module';const require=__cr(import.meta.url);"
          "$esbuild" scripts/verify-windows-desktop-artifact.ts --bundle --platform=node --format=esm \
            --target=node24 --define:import.meta.main=false --banner:js="$banner" \
            --outfile=verify/verify-windows-desktop-artifact.mjs

      - name: Upload verification inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-win-x64
          path: verify/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

      - name: Generate SHA256SUMS and upload Windows installer artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-clean
          cp release/*.exe release-clean/
          (cd release-clean && sha256sum *.exe > SHA256SUMS.txt)
          ls -lh release-clean/

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t3code-clean-win-x64
          path: release-clean/*
          if-no-files-found: error
          compression-level: 0

  verify:
    name: Verify Packaged Windows Runtime
    needs: [build]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download verification inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verify-win-x64
          path: verify

      - name: Verify packaged natives and server sidecar self-containment
        shell: bash
        run: |
          set -euo pipefail
          tar -C verify -xf verify/unpacked.tar
          node verify/verify-windows-desktop-artifact.mjs \
            --app-dir "$(cygpath -w "$PWD/verify/win-unpacked")" \
            --arch x64 \
            --build-version "${{ needs.build.outputs.version }}" \
            --verbose

      - name: Smoke-test resource monitor
        shell: bash
        env:
          MONITOR: verify/win-unpacked/resources/resource-monitor/t3-resource-monitor.exe
        run: |
          node --input-type=module <<'EOF'
          import { spawn } from "node:child_process";
          const monitor = spawn(process.env.MONITOR, { stdio: ["pipe", "pipe", "inherit"] });
          monitor.stdout.setEncoding("utf8");
          let output = "";
          const exited = new Promise((resolve) => monitor.on("close", resolve));
          const hello = await new Promise((resolve, reject) => {
            monitor.on("error", reject);
            monitor.on("close", () => reject(new Error(`Resource monitor exited before hello: ${output}`)));
            monitor.stdout.on("data", (chunk) => {
              output += chunk;
              const end = output.indexOf("\n");
              if (end !== -1) resolve(JSON.parse(output.slice(0, end)));
            });
          });
          if (hello.type !== "hello" || hello.arch !== "x86_64") {
            throw new Error(`Unexpected hello: ${JSON.stringify(hello)}`);
          }
          const send = (message) => monitor.stdin.write(`${JSON.stringify({ version: hello.version, ...message })}\n`);
          send({ type: "configure", rootPid: process.pid, sampleIntervalMs: 1000 });
          send({ type: "sampleNow", requestId: "verify" });
          monitor.stdin.end();
          const exitCode = await exited;
          const sample = output
            .split("\n")
            .filter((line) => line.trim())
            .map((line) => JSON.parse(line))
            .find((message) => message.requestId === "verify");
          if (exitCode !== 0 || sample?.type !== "snapshot" || !sample.processes.some((p) => p.pid === process.pid)) {
            throw new Error(`Resource monitor exited ${exitCode} with: ${output}`);
          }
          console.log(`Resource monitor sampled ${sample.scannedProcessCount} processes.`);
          EOF

  release:
    name: Publish Fork Release
    needs: [build, verify]
    if: inputs.publish_release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download Windows x64 installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: t3code-clean-win-x64
          path: release-clean

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}-clean
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release-clean/* \
            --target clean \
            --prerelease \
            --title "T3 Code Clean $VERSION (Windows x64)" \
            --notes "Telemetry-free, local-only Windows x64 build (zh default, auto-update disabled, cloud/relay/manifest phone-home stripped)."
